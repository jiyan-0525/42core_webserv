# Configuration file for webserv
# Syntax inspired by NGINX

server {
	listen 8080;
	server_name localhost;
	client_max_body_size 10M;

	# Custom error pages
	error_page 404 /errors/404.html;
	error_page 500 /errors/500.html;

	# Root location — serves the static website
	location / {
		root ./www;
		index index.html;
		methods GET;
		autoindex off;
	}

	# Enable directory listing on /files
	location /files {
		root ./www/files;
		methods GET POST DELETE;
		upload_dir ./www/files;
		autoindex on;
	}

	# Upload endpoint
	location /upload {
		root ./www/uploads;
		methods GET POST DELETE;
		upload_dir ./www/uploads;
		client_max_body_size 5M;
	}

	 location /uploads {
        root ./uploads;
        methods GET POST DELETE;
        autoindex on;
    }

	# CGI support
	location /cgi-bin {
		root ./www/cgi-bin;
		methods GET POST DELETE;
		cgi_extension .py;
		cgi_path /usr/bin/python3;
	}

	location /data {
        root ./www/data;
        upload_dir ./www/data;
        methods GET POST DELETE;
        autoindex on;
	}
}

# define a second server on a different port
server {
	listen 8081;
	server_name localhost;

	location / {
		root ./www;
		index index1.html;
		methods GET POST DELETE;
		autoindex off;
	}
}

server {
	listen 8082;
	server_name localhost;

	location / {
		root ./www;
		index 404.html;
		methods GET POST DELETE;
		autoindex off;
	}
}